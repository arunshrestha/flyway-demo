name: Flyway Migration

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java (required for Flyway Java CLI)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Setup Flyway CLI (Java architecture, pinned version)
      - name: Set up Flyway CLI
        uses: red-gate/setup-flyway@v1
        with:
          version: '11.15.0'
          architecture: 'java'
          edition: 'community'

      # Run Flyway migrations using conf file
      - name: Run Flyway Migrations
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: flyway -configFiles=flyway.conf migrate
